name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Embedded-resource smoke test
        shell: pwsh
        run: >-
          python -c "import subprocess,tempfile;
          subprocess.check_call([r'target/release/minicraft-rust.exe','--self-check','--savedir',tempfile.mkdtemp()])"
      - name: Package Windows x64
        shell: pwsh
        run: >-
          python scripts/package.py --platform windows-x86_64
          --binary target/release/minicraft-rust.exe --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
      - name: Create GitHub release and upload Windows archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --title "Minicraft Rust $env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $archive = Get-ChildItem -Path dist -Filter '*.zip' | Select-Object -ExpandProperty FullName
          gh release upload $env:GITHUB_REF_NAME $archive --repo $env:GITHUB_REPOSITORY --clobber
