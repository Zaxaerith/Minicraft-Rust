name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - name: Embedded-resource smoke test
        shell: pwsh
        run: >-
          python -c "import subprocess,tempfile;
          subprocess.check_call([r'target/release/minicraft-rust.exe','--self-check','--savedir',tempfile.mkdtemp()])"
      - name: Package Windows x64
        shell: pwsh
        run: >-
          python scripts/package.py --platform windows-x86_64
          --binary target/release/minicraft-rust.exe --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: minicraft-rust-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
