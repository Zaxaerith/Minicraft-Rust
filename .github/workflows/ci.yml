name: Rust checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Windows x64 MSVC is the supported build and runtime platform.
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      # The full two-day CPU simulation keeps its 15s budget. Limit contention
      # with map/import tests; default parallelism exceeded it in Phase3.
      RUST_TEST_THREADS: "4"
      MINICRAFT_PARITY_RENDER_OUTPUT: ${{ github.workspace }}/target/parity/render-frame/rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust tooling
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      # Windows hosted runners include x64 MSVC and the Windows SDK rc.exe
      # used by build.rs. No physical audio device is needed for self-check.
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      # The 15s two-day simulation budget measures the shipped optimized game.
      # The first real Windows run took 123s in debug and failed that budget;
      # run the entire suite in release instead of weakening/skipping the test.
      - run: cargo test --release --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Embedded resource and PCM smoke check
        run: cargo run --locked -p minicraft-rust -- --self-check --savedir test-data/ci-smoke
