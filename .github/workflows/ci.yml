name: CI

on:
  push:
  pull_request:

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            binary: target/release/minicraft-plus-rust.exe
          - os: ubuntu-latest
            platform: linux-x86_64
            binary: target/release/minicraft-plus-rust
          - os: macos-latest
            platform: macos-native
            binary: target/release/minicraft-plus-rust
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - name: Embedded-resource smoke test
        env:
          BINARY: ${{ matrix.binary }}
        run: >-
          python -c "import os,subprocess,tempfile;
          subprocess.check_call([os.environ['BINARY'],'--self-check','--savedir',tempfile.mkdtemp()])"
      - name: Deterministic package
        run: >-
          python scripts/package.py --platform ${{ matrix.platform }}
          --binary ${{ matrix.binary }} --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: minicraft-plus-rust-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
