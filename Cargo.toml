[package]
name = "minicraft-plus-rust"
version = "2.2.4"
edition = "2024"
description = "A clean Rust reimplementation of Minicraft+ 2.2.4"
license = "GPL-3.0-only"

[dependencies]
minifb = "=0.27.0"
png = "=0.17.16"
serde_json = "1"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }

[profile.release]
lto = "thin"
strip = true
