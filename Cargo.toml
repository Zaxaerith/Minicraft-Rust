[package]
name = "minicraft-rust"
version = "2.2.4"
edition = "2024"
description = "A clean Rust reimplementation of Minicraft"
license = "GPL-3.0-only"

[workspace]
members = [
    ".",
    "crates/minicraft-client",
    "crates/minicraft-common",
    "crates/minicraft-parity",
    "crates/minicraft-server",
]
default-members = ["."]
resolver = "2"

[dependencies]
minicraft-client = { path = "crates/minicraft-client" }
minicraft-common = { path = "crates/minicraft-common" }
minifb = "=0.27.0"
png = "=0.17.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(not(windows))'.dependencies]
sdl2 = { version = "=0.38.0", features = ["bundled", "static-link"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
lto = "thin"
strip = true
